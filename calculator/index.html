<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="inputCal">0</div>
        <div class="keys">
            <button class="key item1">Clear</button>
            <button class="key item2">+</button>
            <button class="key item3">1</button>
            <button class="key item4">2</button>
            <button class="key item5">3</button>
            <button class="key item6">-</button>
            <button class="key item7">4</button>
            <button class="key item8">5</button>
            <button class="key item9">6</button>
            <button class="key item10">*</button>
            <button class="key item11">7</button>
            <button class="key item12">8</button>
            <button class="key item13">9</button>
            <button class="key item14">/</button>
            <button class="key item15">0</button>
            <button class="key item16">.</button>
            <button class="key item17">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
