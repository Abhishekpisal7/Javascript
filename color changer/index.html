<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Color Changer</title>
</head>
<body>
    <div class="parent">
        <h1 class="heading">Color Changer</h1>
        <div class="main">
            <button class="randomColor">Random Color</button>
            <input type="text" id="colorInput" placeholder="Enter color or hex">
            <button class="applyColor">Apply Color</button>
        </div>
        <p class="currentColor">Current Color: <span>orange</span></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
